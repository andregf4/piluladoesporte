name: Coleta de noticias de atletas

on:
  schedule:
    - cron: "0 23 * * *"      # 1x por dia - 06:00 no horário de São Paulo
  workflow_dispatch:         # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write            # necessário para salvar o noticias.csv no repositório

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scraper.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          LOOKBACK_DAYS: "2"

      - name: Salvar noticias.csv (modo CSV)
        run: |
          if [ -f noticias.csv ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add noticias.csv
            git diff --cached --quiet || (git commit -m "Atualiza noticias" && git push)
          fi
